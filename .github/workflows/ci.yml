name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    uses: taraxvoid/voidflow/.github/workflows/site-ci.yml@3f6252e4ab9000744b46d9d4d1a0172ee65cf992 # v0.13.1
    with:
      single-environment: true
