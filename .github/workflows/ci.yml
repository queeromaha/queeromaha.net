name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  # a11y and Lighthouse run only on schedule/dispatch (voidflow site-ci)
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    uses: taraxvoid/voidflow/.github/workflows/site-ci.yml@488be01ffe7e05e337034f6726f00bf423cb5fa5 # pre-v0.17.0, voidflow#209 head; repin to the release tag
