name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # closed: delete the PR's Worker Preview
    types: [opened, synchronize, reopened, ready_for_review, closed]
  workflow_dispatch:
  # a11y (and Lighthouse, if defined) only run on a schedule or manual run
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  validate:
    if: github.event.action != 'closed'
    # site-ci.yml declares pull-requests: write, so the caller must grant it
    permissions:
      contents: read
      pull-requests: write
    uses: taraxvoid/voidflow/.github/workflows/site-ci.yml@3cdc7a254a2886e787b5615e219e43743085998c # v1.0.0-next
    with:
      e2e-extra-paths: '["cloudflare.config.ts", "wrangler.config.ts", "worker/**"]'

  # Blue/green: this deploys green (the Worker on queeromaha.dev). Netlify
  # still serves queeromaha.net until cutover.
  deploy:
    name: Deploy
    needs: validate
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: prod
      url: https://queeromaha.dev
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      CF_SEND_TELEMETRY: 'false'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taraxvoid/voidflow/actions/branch-env-map@3cdc7a254a2886e787b5615e219e43743085998c # v1.0.0-next
      # bun and node (cf needs Node ^24.22) from mise.toml
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - uses: taraxvoid/voidflow/actions/bun-install@3cdc7a254a2886e787b5615e219e43743085998c # v1.0.0-next
      - name: Build
        run: bun run build
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          FORMS_TO: ${{ secrets.FORMS_TO }}
          SHA: ${{ github.sha }}
        run: |
          secrets="$RUNNER_TEMP/worker-secrets.env"
          trap 'rm -f "$secrets"' EXIT
          (umask 077; printf 'FORMS_TO=%s\n' "$FORMS_TO" > "$secrets")
          bun run deploy --secrets-file "$secrets" --message "${SHA:0:7}"
      # Retries cover a custom domain's certificate still provisioning on the
      # first deploy.
      - name: Smoke test
        run: |
          retry=(--retry 12 --retry-delay 10 --retry-all-errors)
          curl -fsS "${retry[@]}" -o /dev/null https://queeromaha.dev/friends/
          md="$RUNNER_TEMP/friends.md"
          curl -fsS "${retry[@]}" -H 'Accept: text/markdown' -o "$md" https://queeromaha.dev/friends/
          grep -q '^# ' "$md"

  # One Worker Preview per PR, named pr-<number>; deleted when the PR closes.
  # Forks get no secrets, so they're skipped.
  preview:
    name: Preview
    needs: validate
    if: >-
      github.event_name == 'pull_request'
      && github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    env:
      CF_SEND_TELEMETRY: 'false'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - uses: taraxvoid/voidflow/actions/bun-install@3cdc7a254a2886e787b5615e219e43743085998c # v1.0.0-next
      - name: Build
        run: bun run build
        env:
          CLOUDFLARE_PREVIEW_BUILD: 'true'
      - name: Deploy Preview
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          out=$(node_modules/.bin/cf previews deploy "pr-$PR_NUMBER" --prebuilt)
          printf '%s\n' "$out"
          json=$(printf '%s' "$out" | sed -n '/^[[:space:]]*{/,$p')
          url=$(jq -r '.preview_urls[0] // empty' <<< "$json")
          if [ -z "$url" ]; then
            echo "::error::cf previews deploy reported no Preview URL" >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Comment Preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        # One comment per PR, found by its marker, updated on later pushes.
        run: |
          marker="<!-- cf-preview:pr-$PR_NUMBER -->"
          body=$(printf '%s\nPreview: %s (at %s)\n' "$marker" "$PREVIEW_URL" "${SHA:0:7}")
          id=$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/$GH_REPO/issues/$PR_NUMBER/comments" -f body="$body" > /dev/null
          fi

  preview-cleanup:
    name: Delete Preview
    if: >-
      github.event_name == 'pull_request'
      && github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: preview
    permissions:
      contents: read
    env:
      CF_SEND_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - uses: taraxvoid/voidflow/actions/bun-install@3cdc7a254a2886e787b5615e219e43743085998c # v1.0.0-next
      - name: Delete Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # A PR whose preview never deployed has nothing to delete.
        run: node_modules/.bin/cf previews delete "pr-$PR_NUMBER" --worker queeromaha --force || true
