name: Check Links

# Dead-link checker - runs scripts/check-links.ts against the built dist/
# HTML and markdown. Weekly all-links scan (cron) + manual dispatch.
on:
  schedule:
    - cron: "0 9 * * 1" # Every Monday 9am UTC - full scan to catch stale/dead links
  workflow_dispatch:

concurrency:
  group: check-links-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Cache npm package dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: taraxvoid/voidflow/actions/bun-install@3f6252e4ab9000744b46d9d4d1a0172ee65cf992 # v0.13.1
      - run: bun run build

      - name: Check links
        run: bun run check:links
